name: digital-memory-assistant

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dma-postgres
    environment:
      POSTGRES_DB: digital_memory
      POSTGRES_USER: dma
      POSTGRES_PASSWORD: dma_local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dma -d digital_memory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
